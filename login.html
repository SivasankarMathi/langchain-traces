<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    :root {
      --bg: linear-gradient(135deg, #667eea, #764ba2);
      --card-bg: #fff;
      --text: #333;
      --label: #555;
      --input-border: #ccc;
      --input-bg: #fff;
      --input-text: #333;
      --accent: #667eea;
    }
    [data-theme="dark"] {
      --bg: linear-gradient(135deg, #1a1a2e, #16213e);
      --card-bg: #232336;
      --text: #eaeaea;
      --label: #b0b0c0;
      --input-border: #44445c;
      --input-bg: #2d2d44;
      --input-text: #eaeaea;
      --accent: #7a8df0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      transition: background 0.3s;
    }
    .card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
    }
    h1 { text-align: center; margin-bottom: 1.5rem; color: var(--text); font-size: 1.5rem; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; color: var(--label); font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--input-bg);
      color: var(--input-text);
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      padding: 0.7rem;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5a6fd6; }
    .error { color: #d9534f; font-size: 0.85rem; margin-top: 0.75rem; text-align: center; min-height: 1em; }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle">Dark Mode</button>
  <form class="card" id="loginForm" novalidate>
    <h1>Sign In</h1>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />
    </div>
    <button type="submit">Log In</button>
    <p class="error" id="error"></p>
  </form>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      if (!email || !password) {
        error.textContent = 'Please enter both email and password.';
        return;
      }
      error.textContent = '';
      alert('Logged in as ' + email);
    });
  </script>
</body>
</html>
