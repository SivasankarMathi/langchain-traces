<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LangChain Traces</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <h1>LangChain Traces</h1>
                <p>Sign in to your workspace</p>
            </div>
            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter username or email" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                </div>
                <div class="error" id="errorMessage" role="alert" hidden></div>
                <div class="success" id="successMessage" role="status" hidden></div>
                <button type="submit" id="loginButton">Sign In</button>
            </form>
            <p class="hint">Test credentials: <code>admin</code> / <code>password</code></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
